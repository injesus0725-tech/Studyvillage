name: Build Studyvillage Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stabilize-touch-buildings-20260820
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and rebuild native modules
        run: npm install

      - name: Verify source syntax
        run: npm run verify

      - name: Build portable EXE
        run: npm run dist:win

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "Portable EXE was not created." }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName) ($($_.Length) bytes)" }

      - name: Add classroom quick guide
        shell: pwsh
        run: Copy-Item CLASSROOM-QUICKSTART.txt dist/CLASSROOM-QUICKSTART.txt

      - name: Upload Windows classroom package
        uses: actions/upload-artifact@v4
        with:
          name: Studyvillage-Windows-stabilized
          path: |
            dist/*.exe
            dist/CLASSROOM-QUICKSTART.txt
          if-no-files-found: error
          retention-days: 30
