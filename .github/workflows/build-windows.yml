name: Build Studyvillage Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stabilization-audit-20260818
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and rebuild native modules
        run: npm install

      - name: Verify source and packaged runtime contract
        shell: pwsh
        run: |
          npm run verify
          node release-package-runtime-contract-selftest.js

      - name: Build portable EXE
        run: npm run dist:win

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) { throw "Portable EXE was not created." }
          $files | ForEach-Object { Write-Host "Built: $($_.FullName) ($($_.Length) bytes)" }

      - name: Add classroom guides
        shell: pwsh
        run: |
          Copy-Item CLASSROOM-QUICKSTART.txt dist/CLASSROOM-QUICKSTART.txt
          Copy-Item STABILIZATION_DEVICE_CHECKLIST.md dist/STABILIZATION_DEVICE_CHECKLIST.md

      - name: Upload Windows classroom package
        uses: actions/upload-artifact@v4
        with:
          name: Studyvillage-Windows-${{ github.ref_name }}
          path: |
            dist/*.exe
            dist/CLASSROOM-QUICKSTART.txt
            dist/STABILIZATION_DEVICE_CHECKLIST.md
          if-no-files-found: error
          retention-days: 30
