name: Verify

on:
  push:
    branches:
      - main
      - agent/physical-shop-fulfillment
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts
      - name: Run repository verification
        run: npm run verify
