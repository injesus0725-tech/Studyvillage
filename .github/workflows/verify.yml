name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts
      - name: Run repository verification
        run: npm run verify
      - name: Run classroom regression bundle
        run: node v1-classroom-regression-contract-selftest.js

  build-stabilized-windows:
    if: github.event_name == 'pull_request' && github.head_ref == 'stabilize-touch-buildings-20260820'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify source syntax
        run: npm run verify
      - name: Build stabilized portable EXE
        run: npm run dist:win
      - name: Add classroom quick guide
        shell: pwsh
        run: Copy-Item CLASSROOM-QUICKSTART.txt dist/CLASSROOM-QUICKSTART.txt
      - name: Upload stabilized Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Studyvillage-Windows-stabilized
          path: |
            dist/*.exe
            dist/CLASSROOM-QUICKSTART.txt
          if-no-files-found: error
          retention-days: 30
