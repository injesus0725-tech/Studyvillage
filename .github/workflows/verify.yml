name: Verify

on:
  push:
    branches: [main, stabilization-audit-20260818]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts
      - name: Run repository verification
        run: npm run verify
      - name: Run classroom regression bundle
        run: node v1-classroom-regression-contract-selftest.js
      - name: Run stabilization route wiring guard
        run: node stabilization-route-wiring-selftest.js
      - name: Run teacher write wiring audit
        run: node stabilization-admin-write-wiring-selftest.js
      - name: Run teacher attempt override guard
        run: node activity-attempt-settings-override-selftest.js
      - name: Run teacher write runtime integration
        run: node stabilization-admin-runtime-integration-selftest.js
      - name: Run stabilized pointer routing guard
        run: node stabilization-pointer-routing-selftest.js
      - name: Run direct movement architecture guard
        run: node student-direct-movement-contract-selftest.js
      - name: Run direct building input guard
        run: node building-direct-input-contract-selftest.js
      - name: Run student activity gate guard
        run: node stabilization-activity-gate-selftest.js
      - name: Run expedition attempt runtime guard
        run: node stabilization-expedition-attempt-runtime-selftest.js
