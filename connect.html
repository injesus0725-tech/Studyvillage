<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studyvillage 교실 시작</title><style>body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#eef7ef;color:#294332}main{max-width:980px;margin:0 auto;padding:30px}h1{margin:0 0 8px;font-size:38px}.sub{color:#607266;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar a,.toolbar button{padding:11px 15px;border:0;border-radius:12px;background:#356f45;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{padding:22px;background:#fff;border-radius:22px;box-shadow:0 8px 25px #244d3030}.adapter{display:inline-block;padding:4px 9px;border-radius:999px;background:#e8f1ff;color:#46628a;font-size:12px;font-weight:900}.url{margin:13px 0;padding:10px;border-radius:10px;background:#f2f5f2;font-weight:900;word-break:break-all}.qr{display:block;width:min(100%,320px);margin:10px auto}.hint{margin-top:22px;padding:16px;border-radius:14px;background:#fff4c9;font-weight:800;color:#6a5516}.status{margin:14px 0;font-weight:900}.teacher-card{margin:18px 0;padding:18px;border-radius:18px;background:#fff;box-shadow:0 6px 18px #244d3020}.teacher-card strong{display:block;margin-bottom:8px}.teacher-links{display:flex;gap:10px;flex-wrap:wrap}.teacher-links a{padding:10px 13px;border-radius:10px;background:#edf4ed;color:#315f3d;text-decoration:none;font-weight:900}</style></head><body><main><h1>🌳 우리 학습마을</h1><div class="sub">교실 서버가 실행되었습니다.</div><section class="teacher-card"><strong>선생님 바로가기</strong><div class="teacher-links"><a href="/admin.html">📊 관리자 화면</a><a href="/">🎮 학생 화면 미리보기</a></div></section><div class="toolbar"><button id="refresh">🔄 학생 접속 주소 다시 찾기</button></div><div id="status" class="status">네트워크 주소를 찾고 있습니다...</div><div id="grid" class="grid"></div><div class="hint">학생 태블릿에서 같은 네트워크에 해당하는 QR을 찍어 접속하세요. 유선과 Wi-Fi가 모두 연결된 PC라면 여러 QR이 보일 수 있습니다. Wi-Fi 동글을 쓰는 경우 학생 태블릿과 같은 Wi-Fi 쪽 주소를 선택하면 됩니다.</div></main><script>const grid=document.querySelector('#grid'),status=document.querySelector('#status');async function load(){status.textContent='네트워크 주소를 찾고 있습니다...';grid.innerHTML='';try{const r=await fetch('/api/network',{cache:'no-store'}),d=await r.json();if(!d.urls?.length){status.textContent='학생 접속 주소를 찾지 못했습니다.';return}status.textContent=`학생 접속 주소 ${d.urls.length}개를 찾았습니다.`;d.urls.forEach(item=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<span class="adapter">${item.adapter}</span><div class="url">${item.url}</div><img class="qr" alt="학생 접속 QR" src="${item.qr}"><button style="width:100%;padding:10px;border:0;border-radius:10px;background:#ffcc4d;font-weight:900;cursor:pointer">주소 복사</button>`;card.querySelector('button').onclick=async()=>{try{await navigator.clipboard.writeText(item.url);card.querySelector('button').textContent='복사됨 ✓'}catch{card.querySelector('button').textContent='직접 주소를 선택해 복사하세요'}};grid.appendChild(card)})}catch{status.textContent='교실 서버와 연결할 수 없습니다.'}}document.querySelector('#refresh').onclick=load;load();</script></body></html>
