<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 학습마을</title><link rel="stylesheet" href="style.css"></head><body><main id="app"><section id="title-screen" class="screen active"><div class="title-card"><div class="tree">🌳</div><h1>우리 학습마을</h1><p>배우고, 도전하고, 함께 성장하는 마을</p><div class="login-box"><label class="name-entry" for="player-name"><span>이름</span><input id="player-name" type="text" maxlength="12" autocomplete="username" placeholder="예: 김하늘"></label><label class="name-entry" for="player-password"><span>비밀번호</span><input id="player-password" type="password" minlength="4" maxlength="30" autocomplete="current-password" placeholder="4자 이상 입력"></label><p class="login-note">처음 입력한 이름과 비밀번호로 계정이 만들어집니다. 다음부터 같은 정보로 입장하세요.</p></div><p id="name-error" class="name-error" aria-live="polite"></p><button id="start-button">마을 입장</button><span class="version">v0.3.0</span></div></section><section id="game-screen" class="screen"><header class="hud"><strong>🌳 우리 학습마을</strong><div class="hud-right"><span class="control-help">방향키/WASD 이동 · Space 상호작용</span><button id="record-button" class="record-button">📋 내 기록</button><div class="player-profile"><span class="profile-avatar">🧑‍🎓</span><strong id="profile-name">학생</strong><span id="profile-score">0점</span></div></div></header><div id="world"><div class="cloud cloud-a">☁️</div><div class="cloud cloud-b">☁️</div><div class="building school obstacle">🏫<span>배움터</span></div><div class="building library obstacle">📚<span>책마루</span></div><div id="quiz-hall" class="building quiz obstacle">❓<span>도전관</span></div><div class="pond obstacle">💧</div><div class="tree-item t1 obstacle">🌳</div><div class="tree-item t2 obstacle">🌲</div><div class="tree-item t3 obstacle">🌳</div><div class="tree-item t4 obstacle">🌲</div><div id="guide-npc" class="npc obstacle" data-name="도우미 선생님"><span class="npc-icon">👩‍🏫</span><span class="npc-name">도우미 선생님</span></div><div id="interaction-hint" class="interaction-hint"></div><div id="player"><span class="player-icon">🧑‍🎓</span><span id="player-label" class="player-label">학생</span></div></div><div id="dialogue" class="dialogue" hidden><div class="dialogue-avatar">👩‍🏫</div><div class="dialogue-body"><strong id="dialogue-name">도우미 선생님</strong><p id="dialogue-text"></p></div><button id="dialogue-next">다음 ▶</button></div><div id="quiz-panel" class="quiz-panel" hidden><div class="quiz-header"><div><span class="quiz-badge">도전관</span><h2>수수께끼 10문제</h2></div><button id="quiz-close" class="quiz-close">✕</button></div><div class="quiz-status"><span id="quiz-progress">1 / 10</span><strong id="quiz-score">이번 도전 0점</strong></div><p id="quiz-question" class="quiz-question"></p><div id="quiz-options" class="quiz-options"></div><div id="quiz-feedback" class="quiz-feedback"></div><button id="quiz-next" class="quiz-next" hidden>다음 문제 ▶</button></div><div id="record-panel" class="record-panel" hidden><div class="record-header"><div><span class="record-badge">내 기록</span><h2 id="record-title">학생의 도전 기록</h2></div><button id="record-close" class="quiz-close">✕</button></div><div class="record-grid"><div><span>🏆 최고 점수</span><strong id="record-best">0점</strong></div><div><span>🎮 도전 횟수</span><strong id="record-attempts">0회</strong></div><div><span>⭐ 누적 점수</span><strong id="record-total">0점</strong></div><div><span>📝 최근 점수</span><strong id="record-last">0점</strong></div></div><p id="record-message" class="record-message"></p><button id="record-go-quiz" class="quiz-next">닫기</button></div><footer class="mobile-controls"><button data-key="ArrowUp">▲</button><div><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="talk-button" class="talk-button">✨ 상호작용</button></footer></section></main><script src="auth.js"></script><script src="game.js"></script></body></html>
