<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 학습마을</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="title-screen" class="screen active">
      <div class="title-card">
        <div class="tree">🌳</div>
        <h1>우리 학습마을</h1>
        <p>배우고, 도전하고, 함께 성장하는 마을</p>
        <button id="start-button">게임 시작</button>
        <span class="version">v0.2.1</span>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="hud">
        <strong>🌳 우리 학습마을</strong>
        <span>방향키 또는 WASD로 이동</span>
      </header>
      <div id="world" aria-label="학습마을 광장">
        <div class="cloud cloud-a">☁️</div>
        <div class="cloud cloud-b">☁️</div>
        <div class="building school">🏫<span>배움터</span></div>
        <div class="building library">📚<span>책마루</span></div>
        <div class="building quiz">❓<span>도전관</span></div>
        <div class="pond">💧</div>
        <div class="tree-item t1">🌳</div>
        <div class="tree-item t2">🌲</div>
        <div class="tree-item t3">🌳</div>
        <div class="tree-item t4">🌲</div>
        <div id="player" role="img" aria-label="플레이어 캐릭터">🧑‍🎓</div>
      </div>
      <footer class="mobile-controls" aria-label="이동 버튼">
        <button data-key="ArrowUp">▲</button>
        <div>
          <button data-key="ArrowLeft">◀</button>
          <button data-key="ArrowDown">▼</button>
          <button data-key="ArrowRight">▶</button>
        </div>
      </footer>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
